<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Efkan Dilber | Portfolyo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Ekranın tamamını kaplayan ana kutu */
        .hero-section {
            position: relative;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* FOTOĞRAFI KURTARAN KISIM BURASI */
        .hero-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ekranı kaplamasını sağlar */
            /* 95% değeri sayesinde fotoğrafı en dibinden yukarı çeker, yüzün ortaya gelir */
            object-position: center 77%; 
            z-index: 1;
        }

        /* Fotoğrafın üzerine binen hafif karanlık katman (Yazılar okunsun diye) */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 2;
        }

        /* Yazıların olduğu kutu */
        .hero-content {
            position: relative;
            z-index: 3;
            text-align: center;
            color: white;
            padding: 0 20px;
        }

        .hero-content h1 { 
            font-size: clamp(2.5rem, 8vw, 4.5rem); /* Ekrana göre büyür küçülür */
            margin: 0; 
            color: var(--accent);
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
            font-weight: 900;
        }

        .hero-content p { 
            font-size: clamp(1rem, 4vw, 1.6rem);
            margin-top: 15px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
        }

        .cta-btn {
            display: inline-block;
            background: var(--accent);
            color: #0f172a !important;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 800;
            margin-top: 30px;
            text-transform: uppercase;
            box-shadow: 0 10px 25px rgba(251, 191, 36, 0.4);
            transition: 0.3s;
        }

        .cta-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="hakkimda.html">Hakkımda</a>
        <a href="egitim.html">Eğitim & Hobiler</a>
        <a href="iletisim.html">İletişim</a>
    </nav>

    <div class="hero-section">
        <img src="efkan .jpeg" alt="Efkan Dilber" class="hero-img">
        
        <div class="hero-overlay"></div>
        
        <div class="hero-content">
            <h1>Mehmet Efkan Dilber</h1>
            <p>Bilişim Teknolojileri Öğrencisi & Gezgin Adayı</p>
            <a href="hakkimda.html" class="cta-btn">Beni Keşfedin</a>
        </div>
    </div>
</body>
</html>

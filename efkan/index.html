<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efkan Dilber | Portfolyo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        
        .hero-container {
            position: relative;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0f172a;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* BURASI SENİ ORTALAR: Fotoğrafın alt tarafına odaklanır */
            object-position: center 85%; 
            z-index: 1;
            filter: brightness(0.5);
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: white;
            padding: 20px;
        }

        .content h1 { 
            font-size: clamp(2.5rem, 8vw, 4rem); 
            margin: 0; 
            color: #fbbf24;
            text-shadow: 0 5px 20px rgba(0,0,0,0.8);
            font-weight: 900;
        }

        .cta-btn {
            display: inline-block;
            background: #fbbf24;
            color: #0f172a !important;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 800;
            margin-top: 25px;
            text-transform: uppercase;
        }

        nav {
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.7);
            padding: 15px 0;
            text-align: center;
        }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: 600; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="hakkimda.html">Hakkımda</a>
        <a href="egitim.html">Eğitim & Hobiler</a>
        <a href="iletisim.html">İletişim</a>
    </nav>

    <div class="hero-container">
        <img src="efkan.jpg" alt="Efkan Dilber" class="hero-bg">
        
        <div class="content">
            <h1>Mehmet Efkan Dilber</h1>
            <p>Bilişim Teknolojileri Öğrencisi & Gezgin Adayı</p>
            <a href="hakkimda.html" class="cta-btn">Beni Keşfedin</a>
        </div>
    </div>
</body>
</html>
